{% extends 'base.html' %} 
{% load socialaccount %} {% block content %}
<div style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
    <h2>Login</h2>
    
    <div id="step-email">
        <label for="email-input">Email Address</label><br>
        <input type="email" id="email-input" placeholder="you@example.com" required style="width: 100%; padding: 8px; margin: 10px 0;">
        <button onclick="requestOTP()" style="width: 100%; padding: 10px; background: #007BFF; color: white; border: none; cursor: pointer;">
            Send OTP
        </button>
    </div>

    <div id="step-otp" style="display: none;">
        <p style="color: green;">OTP sent! Please check your email (or terminal).</p>
        <label for="otp-input">Enter 6-digit Code</label><br>
        <input type="text" id="otp-input" placeholder="123456" required style="width: 100%; padding: 8px; margin: 10px 0;">
        <button onclick="verifyOTP()" style="width: 100%; padding: 10px; background: #28A745; color: white; border: none; cursor: pointer;">
            Verify & Login
        </button>
    </div>

    <p id="status-message" style="color: red; margin-top: 15px; font-weight: bold;"></p>

    <div style="text-align: center; margin: 25px 0;">
        <span style="background: #fff; padding: 0 10px; color: #888;">OR</span>
        <hr style="margin-top: -10px; border: 0; border-top: 1px solid #ccc; z-index: -1; position: relative;">
    </div>

    <form action="{% provider_login_url 'google' %}" method="post" style="margin-bottom: 20px;">
        {% csrf_token %}
        <button type="submit" style="width: 100%; padding: 10px; background: white; color: #444; border: 1px solid #ccc; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Continue with Google
        </button>
    </form>
</div>

<script>
    const SEND_OTP_URL = "{% url 'accounts:send_otp' %}"; 
    const VERIFY_OTP_URL = "{% url 'accounts:verify_otp' %}";

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function requestOTP() {
        const email = document.getElementById('email-input').value;
        const statusMsg = document.getElementById('status-message');
        
        statusMsg.style.color = "black";
        statusMsg.innerText = "Sending..."; 
        
        const csrftoken = getCookie('csrftoken'); 

        try {
            const response = await fetch(SEND_OTP_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken 
                },
                body: JSON.stringify({ email: email })
            });
            
            if (response.ok) {
                document.getElementById('step-email').style.display = 'none';
                document.getElementById('step-otp').style.display = 'block';
                statusMsg.innerText = ""; 
            } else {
                const data = await response.json();
                statusMsg.style.color = "red";
                statusMsg.innerText = data.error || "Failed to send OTP.";
            }
        } catch (error) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Network error occurred.";
        }
    }

    async function verifyOTP() {
        const email = document.getElementById('email-input').value;
        const otp = document.getElementById('otp-input').value;
        const statusMsg = document.getElementById('status-message');
        
        statusMsg.style.color = "black";
        statusMsg.innerText = "Verifying...";

        const csrftoken = getCookie('csrftoken'); 

        try {
            const response = await fetch(VERIFY_OTP_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken 
                },
                body: JSON.stringify({ email: email, otp: otp })
            });

            const data = await response.json();

            if (response.ok) {
                statusMsg.style.color = "green";
                statusMsg.innerText = "Login successful! Redirecting...";
                window.accessToken = data.access; 
                setTimeout(() => { window.location.href = '/'; }, 1000);
            } else {
                statusMsg.style.color = "red";
                statusMsg.innerText = data.error || "Invalid OTP.";
            }
        } catch (error) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Network error occurred.";
        }
    }
</script>
{% endblock %}
