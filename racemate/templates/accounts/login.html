{% extends 'base.html' %} 
{% load socialaccount %} {% block content %}
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 50%, #f0f9ff 100%);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative background blobs */
  .login-wrapper::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    top: -100px;
    left: -100px;
    border-radius: 50%;
    pointer-events: none;
  }

  .login-wrapper::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
    bottom: -80px;
    right: -80px;
    border-radius: 50%;
    pointer-events: none;
  }

  .blob-mid {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
    top: 50%;
    left: 60%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
  }

  .login-card {
    background: #ffffff;
    border: 1px solid rgba(99, 102, 241, 0.12);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.03), 0 20px 60px rgba(99, 102, 241, 0.1);
    position: relative;
    z-index: 1;
  }

  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .brand-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
  }

  .brand-icon svg {
    width: 26px;
    height: 26px;
    fill: white;
  }

  .brand-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #1e1b4b;
  }

  .brand-tagline {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 3px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .login-title {
    font-size: 20px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 5px;
  }

  .login-subtitle {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 28px;
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .form-input {
    width: 100%;
    padding: 13px 16px;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    color: #111827;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
  }

  .form-input::placeholder { color: #d1d5db; }

  .form-input:focus {
    border-color: #6366f1;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
    margin-top: 8px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: #e5e7eb;
  }

  .divider-text {
    font-size: 12px;
    color: #9ca3af;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .btn-google {
    width: 100%;
    padding: 13px;
    background: #fff;
    color: #374151;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
  }

  .btn-google:hover {
    background: #f9fafb;
    border-color: #d1d5db;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }

  .status-message {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    display: none;
  }

  .status-message.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    display: block;
  }

  .status-message.success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #16a34a;
    display: block;
  }

  .status-message.info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #2563eb;
    display: block;
  }

  .otp-info {
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
    margin-top: 14px;
  }

  .back-link {
    background: none;
    border: none;
    color: #6366f1;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    margin-top: 14px;
    display: block;
    text-align: center;
    transition: color 0.2s;
  }

  .back-link:hover { color: #4f46e5; text-decoration: underline; }

  .otp-input-wrapper {
    position: relative;
  }

  #otp-input {
    letter-spacing: 10px;
    font-size: 24px;
    text-align: center;
    font-weight: 700;
    color: #1e1b4b;
    padding: 16px;
  }
</style>

<div class="login-wrapper">
  <div class="blob-mid"></div>
  <div class="login-card">

    <div class="login-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
      </div>
      <div class="brand-name">Racemate</div>
      <div class="brand-tagline">Race Management Platform</div>
    </div>

    <!-- Step 1: Email -->
    <div id="step-email">
      <div class="login-title">Welcome back 👋</div>
      <div class="login-subtitle">Sign in to your account to continue</div>

      <div class="form-group">
        <label class="form-label" for="email-input">Email Address</label>
        <input type="email" id="email-input" class="form-input" placeholder="you@example.com" required />
      </div>

      <button onclick="requestOTP()" class="btn-primary" id="send-otp-btn">
        Continue with Email →
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or</span>
        <div class="divider-line"></div>
      </div>

      <form action="{% provider_login_url 'google' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
            <path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/>
            <path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/>
            <path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
          </svg>
          Continue with Google
        </button>
      </form>
    </div>

    <!-- Step 2: OTP -->
    <div id="step-otp" style="display:none;">
      <div style="text-align:center; margin-bottom: 24px;">
        <div style="width:56px; height:56px; background: #eff6ff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin: 0 auto 16px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <div class="login-title">Check your inbox</div>
        <div class="login-subtitle">We sent a code to<br><strong style="color:#6366f1;" id="email-display"></strong></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="otp-input">Verification Code</label>
        <div class="otp-input-wrapper">
          <input type="text" id="otp-input" class="form-input" placeholder="000000" maxlength="6" required />
        </div>
      </div>

      <button onclick="verifyOTP()" class="btn-primary">
        Verify & Sign In
      </button>

      <button class="back-link" onclick="goBack()">← Use a different email</button>
      <p class="otp-info">Didn't receive it? Check your spam folder.</p>
    </div>

    <div id="status-message" class="status-message"></div>

  </div>
</div>

<script>
  const SEND_OTP_URL = "{% url 'accounts:send_otp' %}";
  const VERIFY_OTP_URL = "{% url 'accounts:verify_otp' %}";

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function showStatus(message, type) {
    const el = document.getElementById('status-message');
    el.className = 'status-message ' + type;
    el.innerText = message;
  }

  function hideStatus() {
    const el = document.getElementById('status-message');
    el.className = 'status-message';
    el.innerText = '';
  }

  function goBack() {
    document.getElementById('step-otp').style.display = 'none';
    document.getElementById('step-email').style.display = 'block';
    hideStatus();
  }

  async function requestOTP() {
    const email = document.getElementById('email-input').value;
    const btn = document.getElementById('send-otp-btn');
    if (!email) return showStatus('Please enter your email address.', 'error');

    btn.innerText = 'Sending...';
    btn.disabled = true;
    hideStatus();

    try {
      const response = await fetch(SEND_OTP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ email })
      });

      if (response.ok) {
        document.getElementById('email-display').innerText = email;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-otp').style.display = 'block';
      } else {
        const data = await response.json();
        showStatus(data.error || 'Failed to send OTP.', 'error');
      }
    } catch {
      showStatus('Network error. Please try again.', 'error');
    } finally {
      btn.innerText = 'Continue with Email →';
      btn.disabled = false;
    }
  }

  async function verifyOTP() {
    const email = document.getElementById('email-input').value;
    const otp = document.getElementById('otp-input').value;
    if (!otp) return showStatus('Please enter the verification code.', 'error');

    showStatus('Verifying...', 'info');

    try {
      const response = await fetch(VERIFY_OTP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({ email, otp })
      });

      const data = await response.json();

      if (response.ok) {
        showStatus('Login successful! Redirecting...', 'success');
        window.accessToken = data.access;
        setTimeout(() => { window.location.href = '/'; }, 1000);
      } else {
        showStatus(data.error || 'Invalid OTP. Please try again.', 'error');
      }
    } catch {
      showStatus('Network error. Please try again.', 'error');
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('step-otp').style.display !== 'none') {
        verifyOTP();
      } else {
        requestOTP();
      }
    }
  });
</script>
{% endblock %}
