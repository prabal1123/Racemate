{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Registrations</h3>
        <a href="{% url 'accounts:register' %}" class="btn btn-primary rounded-3">
          + New Registration
        </a>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for reg in registrations %}
            <tr>
              <td>{{ reg.id }}</td>
              <td class="fw-semibold">{{ reg.name }}</td>
              <td>{{ reg.email }}</td>
              <td class="text-center">

                <a href="{% url 'registration_edit' pk=reg.id %}"
                   class="btn btn-sm btn-outline-primary me-2">
                  Edit
                </a>

                <form action="{% url 'registration_delete' pk=reg.id %}"
                      method="post"
                      class="d-inline">
                  {% csrf_token %}
                  <button type="submit"
                          class="btn btn-sm btn-outline-danger"
                          onclick="return confirm('Delete this registration?');">
                    Delete
                  </button>
                </form>

              </td>
            </tr>

            {% empty %}
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                No registrations found.
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

{% endblock %}
